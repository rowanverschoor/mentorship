# WebSocket requests ask to "upgrade" the connection; pass that on, close otherwise.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;

  # The Angular app
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # Same origin as the app, so the browser needs no CORS.
  # /api/weather -> http://api:8080/weather  ("api" is the compose service name)
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header X-Forwarded-For $remote_addr;

    # Needed for SignalR's WebSocket on /api/hubs/
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
