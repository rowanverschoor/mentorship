server {
  listen 80;

  # The Angular app
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  # Same origin as the app, so the browser needs no CORS.
  # /api/weather -> http://api:8080/weather  ("api" is the compose service name)
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
